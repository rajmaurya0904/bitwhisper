[project]
name = "bitwhisper"
version = "0.1.0"
description = "Terminal tool that loads a binary file and finds headers or structures by field constraints (e.g. 'u32 length between 10 and 100 following magic PNG'), using a small declarative schema. For reverse engineers and file-format hackers."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bitwhisper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
